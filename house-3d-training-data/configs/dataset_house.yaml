dataset:
  name: house
  category: architecture
  version: "0.1"

paths:
  root: datasets/house

split:
  train: 0.8
  validation: 0.1
  test: 0.1
  # Split is assigned by scene *template* hash (see generators/house/house.py),
  # not by individual sample, so near-duplicate houses can't leak across splits.

generation:
  seed: null # set via --seed CLI flag for reproducible runs
  resolution: [512, 512]
  image_format: png
  mesh_formats: [glb, obj]
  views: [front, back, left, right, top, isometric, random]
  supersample: 2 # rasterize at Nx resolution then downsample (cheap antialiasing)
  light_direction: [-0.4, -0.6, -0.7] # canonical_render: fixed directional light
  ambient: 0.35 # ambient term added to lambert shading, 0-1
  fov_degrees: 50.0
  near: 0.05
  far: 100.0

quality:
  min_overall_quality: 0.85

component_priority:
  # Initial distribution target for the first 10,000 samples (prompt.txt section 40).
  # Advisory only -- the generator remains configurable and this is not enforced as a hard quota.
  wall: 0.20
  door: 0.15
  window: 0.15
  floor: 0.10
  roof: 0.10
  staircase: 0.05
  column: 0.05
  beam: 0.05
  balcony: 0.05
  complete_room_or_house: 0.10
