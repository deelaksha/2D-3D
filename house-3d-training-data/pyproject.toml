[project]
name = "house-3d-training-data"
version = "0.1.0"
description = "Reusable 2D-to-3D architectural training-data generation and management system"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pillow>=10.3",
    "pyyaml>=6.0",
    "click>=8.1",
    "tqdm>=4.66",
    "trimesh>=4.4",
    "opencv-python-headless>=4.10",
    "manifold3d>=3.5.2",
    "rtree>=1.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schemas", "generators", "validation", "tools", "preprocessing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
